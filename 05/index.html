<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <style>
      html, body { 
        background-color:#000000;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden !important;  
      }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@latest/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';      
        import { AnaglyphEffect } from 'three/addons/effects/AnaglyphEffect.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import {Pane} from 'https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js';
        import { VertexNormalsHelper } from 'three/addons/helpers/VertexNormalsHelper.js';

        const scene = new THREE.Scene();

        // setup the camera
        const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 2.5, 6);

        // create renderer and setup the canvas
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight );
        document.body.appendChild(renderer.domElement );

        // setup ambient lights
        const ambientLight = new THREE.AmbientLight();
        scene.add( ambientLight );

        // setup directional light
        const directionalLight = new THREE.DirectionalLight();
        scene.add( directionalLight );

        const quaternion_180 = new THREE.Quaternion();
        quaternion_180.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI);

        const reset_q = new THREE.Quaternion();
        reset_q.identity();
        
        // setup anaglyph effect
        const anaglyphEffect = new AnaglyphEffect(renderer);
        
        // // stats.js widget
        const stats = new Stats();
        document.body.appendChild( stats.domElement );

        // SCENE SETTINGS
        window['SCENE'] = {
          'anaglyph': false,
          'poly': null,
          'rotate_poly': false,
          'do_rotate_poly': function() {
            window['SCENE']['rotate_poly'] = !window['SCENE']['rotate_poly'];
           },
          'blender': null,
          'rotate_blender': false,
          'do_rotate_blender': function() {
            window['SCENE']['rotate_blender'] = !window['SCENE']['rotate_blender'];
           },
          'blender_helper': null,
          'blender_old_material': null,
          'change_material': function() {
            if (!window['SCENE']['blender_old_material']) {
              window['SCENE']['blender_old_material'] = window['SCENE']['blender'].material.clone();
              window['SCENE']['blender'].material = new THREE.MeshNormalMaterial();
            } else {
              window['SCENE']['blender'].material = window['SCENE']['blender_old_material'].clone();
              window['SCENE']['blender_old_material'] = null;
            }
          }
        };

        // TweakPane UI
        const pane = new Pane();
        const sceneui = pane.addFolder({title: 'Scene'});

        sceneui.addBinding(window.SCENE, 'anaglyph');
        sceneui.addBinding(directionalLight.position, 'x', {min:-100, max:150, label:'Light X'});
        sceneui.addBinding(directionalLight.position, 'y', {min:-100, max:150, label:'Light Y'});
        sceneui.addBinding(directionalLight.position, 'z', {min:-100, max:150, label:'Light Z'});
        sceneui.addBinding(directionalLight, 'intensity', {min:-10, max:20, label:'Intensity'});
        sceneui.addBinding(ambientLight, 'color', {label:'AmbientLight Color'});
        
        // Load a binary glTF file 
        const loader = new GLTFLoader();
        loader.load( 'poly.glb', function (gltf) {
          scene.add(gltf.scene);
          const poly = gltf.scenes[0].children[0];

          poly.scale.set(20, 20, 20);
          poly.translateX(2.5)
          
          window.SCENE.poly = poly;

          const polyui = pane.addFolder({title: 'PolyCam Mesh'});
          polyui.addBinding(window.SCENE.poly.material, 'wireframe');
          polyui.addButton({title:'rotate!'}).on('click', () => {
            window.SCENE.do_rotate_poly();
          });
        });

        loader.load('sqrl.glb', function (gltf) {
          scene.add(gltf.scene);
          const blender = gltf.scenes[0].children[0];

          blender.scale.set(20,20,20);
          blender.quaternion.set(0, 0, 0, 1);
          blender.translateX(-2);

          window.SCENE.blender = blender;

          const helper = new VertexNormalsHelper(blender, 0.1, 'blue');
          scene.add(helper);
          helper.visible = false;
          window.SCENE.blender_helper = helper;

          // setting up blenderui etc.
          const blenderui = pane.addFolder({title: 'Blender Mesh'});
          blenderui.addBinding(helper, 'visible', {label:'Show normals!'});
          blenderui.addButton({title:'Change Material'}).on('click', () => {
            window.SCENE.change_material();
          });
          blenderui.addButton({title:'rotate!'}).on('click', () => {
            window.SCENE.do_rotate_blender();
          });
        } );
        
        // SetUp Controls
        const controls = new OrbitControls(camera, renderer.domElement);
       
        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          stats.update();

          if (window.SCENE.poly) {
            if(window.SCENE.rotate_poly) {              
              window.SCENE.poly.quaternion.slerp(quaternion_180, 0.01 );
            } else {
              window.SCENE.poly.quaternion.slerp(reset_q, 0.01);
            }
          }

          if (window.SCENE.blender) {
            if(window.SCENE.rotate_blender){
              window.SCENE.blender.quaternion.slerp(quaternion_180, 0.01 );
            } else {
              window.SCENE.blender.quaternion.slerp(reset_q, 0.01);
            }
          }
          
          if (window.SCENE.anaglyph) {
            anaglyphEffect.render(scene, camera);
          } else {
            renderer.render(scene, camera);
          }

          if(window.SCENE.blender_helper) {
            window.SCENE.blender_helper.update();
          }
        };
        animate();
    </script>
</body>
</html>
